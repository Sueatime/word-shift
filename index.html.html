:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--muted:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--gre:#22c55e;--yel:#eab308;--red:#ef4444;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}

#typed.empty{color:var(--muted);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none}
#typed.off{opacity:.4}
#msg{min-height:26px;font-weight:600;margin:6px 0 10px}
.hid{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;opacity:0;pointer-events:none}
.g{position:relative;background:var(--panel);border-radius:10px;margin:4px 0;height:36px;overflow:hidden}
.g .bar{position:absolute;inset:0 auto 0 0;opacity:.85}
.g .t{position:relative;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 12px;font-weight:700;font-size:17px;color:#fff;text-shadow:0 1px 2px #0008}
.g.last{outline:3px solid var(--ink);outline-offset:-3px}
.g.hint .w::after{content:" (hint)";font-weight:400;font-size:12px}
.lab{color:var(--muted);font-size:15px;margin:14px 0 2px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.acts button{padding:10px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--muted)}
.acts button:disabled{opacity:.4;cursor:not-allowed}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}

@media (prefers-reduced-motion:reduce){.win{animation:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.cat{font-size:27px;gap:14px;margin-bottom:34px}
.theme{font-size:26px;padding:8px 26px}
#typed{max-width:440px;min-height:60px;font-size:30px}
#typed.empty{font-size:20px}
#msg{min-height:40px}
.g{height:48px}
.g .t{font-size:22px;padding:0 16px}
.g.hint .w::after{font-size:15px}
.lab{font-size:20px}
.acts button{padding:14px 30px}
.win{font-size:30px;max-width:620px}
}

<p class="sub">Guess the secret word from the theme. The closer the meaning, the lower the rank. Rank 1 wins.</p>

</main>

const $=id=>document.getElementById(id);
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};

let rn=0,slots=[];
function buildRanks(sec){
  const pos=TOPICS.map(t=>t.indexOf(sec));
  const scored=DICT.map(w=>{
    let best=Infinity;
    TOPICS.forEach((t,k)=>{const i=pos[k];if(i<0)return;const j=t.indexOf(w);if(j>=0)best=Math.min(best,Math.abs(i-j))});
    const sc=w===sec?-1:(best<Infinity?best:90+hash(w+sec)%90);
    return [w,sc,hash(sec+w)];
  }).sort((a,b)=>a[1]-b[1]||a[2]-b[2]);
  rankOf={};scored.forEach((x,i)=>rankOf[x[0]]=i+1);order=scored.map(x=>x[0]);
}

  if(rankOf[w]||VALID.has(w))return true;
  if(w.length<8)return false;
  const base=x=>rankOf[x]||VALID.has(x);
  for(const [suf,rep] of [["ies","y"],["es",""],["s",""],["ed",""],["ed","e"],["ing",""],["ing","e"],["ers",""],["er",""],["ly",""],["ness",""],["ful",""],["less",""],["ment",""]]){
    if(w.endsWith(suf)&&w.length-suf.length>=4&&base(w.slice(0,-suf.length)+rep))return true;
  }
  return false;
}

  const col=r<=40?"var(--gre)":r<=300?"var(--yel)":"var(--red)";
  return `<div class="g${last?" last":""}${g.hint?" hint":""}"><div class="bar" style="width:${w}%;background:${col}"></div><div class="t"><span class="w">${g.w}</span><span>${r}</span></div></div>`;
}
function typed(){

function draw(){

function start(){

let winner="";
function popup(){
  let nm=winner;

  const m=$("msg");m.textContent="";m.appendChild(d);

function submit(){
  if(over)return;

  if(!w)return;
  if(!rankOf[w]&&w.endsWith("s")&&rankOf[w.slice(0,-1)])w=w.slice(0,-1);

function giveHint(){

document.addEventListener("click",e=>{if(!over&&!e.target.closest("button"))gi.focus()});
$("new").onclick=start;
$("hint").onclick=giveHint;
$("give").onclick=giveUp;
function remote(word,name){
  if(over)return;
  word=String(word||"").trim().toLowerCase();
  if(!/^[a-z]+$/.test(word))return;
  cur=word;winner=String(name||"").trim().slice(0,30);submit();winner="";
}
window.submitGuess=remote;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.type==="guess")remote(d.word,d.name)});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){let ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
 ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;const u=d.user||{};remote(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
 ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();})();
}
start();
